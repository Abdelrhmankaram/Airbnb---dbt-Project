models:
  - name: dim_listings
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
    
    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        # description: '{{ doc("dim_listings__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts
    config:
      contract:
        enforced: true
    
    columns:
      - name: host_id
        data_type: integer
        constraints:
          - type: not_null
          - type: unique

        data_tests:
          - not_null
          - unique

      - name: host_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: is_superhost
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]

      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp

  - name: fact_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id

      - name: reviewer_name
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']